name: CI Tests

# Restrict permissions to minimum required
permissions:
  contents: read

on:
  # Run on pull requests
  pull_request:
    branches: [ main, Refactor-Ideas ]
  
  # Run on push to feature branches
  push:
    branches-ignore:
      - main
      - gh-pages
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        make install
        
    - name: Run tests
      run: make test
        
    - name: Lint with flake8
      run: make lint
        
    - name: Quick build test
      run: make quick
        
    - name: Verify build outputs
      run: |
        # Check that required files exist in dist/
        test -f dist/index.html
        test -f dist/cna.html
        test -f dist/data-quality.html
        test -f dist/static/css/style.css
        echo "✅ Build outputs verified"
