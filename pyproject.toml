[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvedb"
version = "0.1.0"
description = "CVE Database Analysis and CNA Scorecard Tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2",
    "requests",
    "pandas",
    "fsspec"
]

[project.scripts]
cvedb-build = "scripts.build:main"

[tool.setuptools.packages.find]
where = ["src"]
